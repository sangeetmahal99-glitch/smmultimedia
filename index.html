    <script>
      // Safeguard against runtime errors when packages/extensions attempt to overwrite window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configured
        }
      })();
    </script>
